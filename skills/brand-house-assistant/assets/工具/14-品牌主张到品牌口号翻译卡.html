  <body data-tool-id="14-proposition-slogan">
    <main class="tool-sheet">
      <div class="tool-kicker">
        工具14 · 对应第14章
      </div>
      <h1>
        品牌主张到品牌口号翻译卡
      </h1>
      <p class="tool-subtitle">
        将内部主张转为用户能理解、记忆和复述的品牌级表达。
      </p>
      <div class="confidential">
        公司内部资料，请勿外传。品牌口号不强制使用“更XX”；拟外用时必须以最终可见原句完成事实、广告与食品表达审查。
      </div>
      <div class="tool-toolbar">
        <button type="button" data-action="save">保存本机草稿</button><button type="button" class="secondary" data-action="print">打印/存为PDF</button><button type="button" class="danger" data-action="reset">清空当前工具</button><span class="save-status" data-save-status>尚未填写</span>
      </div>
      <section class="instruction">
        <strong>使用方法：</strong>本卡只做品牌层表达。它不是产品口号卡，也不是战役创意简报；候选不应因含“更”字就被当作差异化价值。
      </section>
      <h2>
        一、翻译输入
      </h2>
      <div class="grid three">
        <div class="field">
          <label class="required">独立品牌</label><input name="brand">
        </div>
        <div class="field">
          <label>目标受众</label><input name="audience">
        </div>
        <div class="field">
          <label>预期使用周期</label><input name="cycle">
        </div>
        <div class="field full">
          <label>内部品牌主张</label>
          <textarea name="proposition">
</textarea>
        </div>
        <div class="field">
          <label>品牌人格/语言边界</label>
          <textarea name="persona">
</textarea>
        </div>
        <div class="field">
          <label>定位与差异化价值摘要</label>
          <textarea name="positioning">
</textarea>
        </div>
        <div class="field">
          <label>RTB和事实状态</label>
          <textarea name="rtb">
</textarea>
        </div>
      </div>
      <h2>
        二、候选翻译与测试
      </h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>
                品牌口号候选
              </th>
              <th>
                保留了什么战略方向
              </th>
              <th>
                用户语言依据
              </th>
              <th>
                记忆/复述测试
              </th>
              <th>
                可能误读
              </th>
              <th>
                候选处理（辅助判断，非正式裁决）
              </th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>
                <textarea name="slogan1">
</textarea>
              </td>
              <td>
                <textarea name="strategy1">
</textarea>
              </td>
              <td>
                <textarea name="language1">
</textarea>
              </td>
              <td>
                <textarea name="memory1">
</textarea>
              </td>
              <td>
                <textarea name="risk1">
</textarea>
              </td>
              <td>
                <select name="decision1">
                  <option>
                    待裁决
                  </option>
                  <option>
                    保留测试
                  </option>
                  <option>
                    修改
                  </option>
                  <option>
                    淘汰
                  </option>
                </select>
              </td>
            </tr>
            <tr>
              <td>
                <textarea name="slogan2">
</textarea>
              </td>
              <td>
                <textarea name="strategy2">
</textarea>
              </td>
              <td>
                <textarea name="language2">
</textarea>
              </td>
              <td>
                <textarea name="memory2">
</textarea>
              </td>
              <td>
                <textarea name="risk2">
</textarea>
              </td>
              <td>
                <select name="decision2">
                  <option>
                    待裁决
                  </option>
                  <option>
                    保留测试
                  </option>
                  <option>
                    修改
                  </option>
                  <option>
                    淘汰
                  </option>
                </select>
              </td>
            </tr>
            <tr>
              <td>
                <textarea name="slogan3">
</textarea>
              </td>
              <td>
                <textarea name="strategy3">
</textarea>
              </td>
              <td>
                <textarea name="language3">
</textarea>
              </td>
              <td>
                <textarea name="memory3">
</textarea>
              </td>
              <td>
                <textarea name="risk3">
</textarea>
              </td>
              <td>
                <select name="decision3">
                  <option>
                    待裁决
                  </option>
                  <option>
                    保留测试
                  </option>
                  <option>
                    修改
                  </option>
                  <option>
                    淘汰
                  </option>
                </select>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <h2>
        三、外用门禁
      </h2>
      <div class="check-list">
        <label class="check-item"><input type="checkbox" name="brandLevel"><span>服务整个品牌，换SKU后仍成立</span></label><label class="check-item"><input type="checkbox" name="notCampaign"><span>不依赖一次活动机制或日期</span></label><label class="check-item"><input type="checkbox" name="notRaw"><span>没有直接照抄内部品牌主张</span></label><label class="check-item"><input type="checkbox" name="factReviewed"><span>最终原句与RTB、事实状态已核对</span></label><label class="check-item"><input type="checkbox" name="complianceReviewed"><span>广告、标签、营养健康、比较、引证风险已审查</span></label><label class="check-item"><input type="checkbox" name="noForceMore"><span>未将“更XX”误作品牌口号句式要求</span></label>
      </div>
      <div class="grid">
        <div class="field">
          <label>最终外用原句与版本</label>
          <textarea name="finalLine">
</textarea>
        </div>
        <div class="field">
          <label>使用渠道与期限</label>
          <textarea name="use">
</textarea>
        </div>
        <div class="field">
          <label>法规/法务结论</label>
          <textarea name="compliance">
</textarea>
        </div>
        <div class="field">
          <label>最终确认人和日期</label>
          <textarea name="approval">
</textarea>
        </div>
      </div>
      <footer class="tool-footer">
        品牌口号的合格条件是忠实转译品牌主张和人格、用户可理解且可外用，不是是否带“更”字。
      </footer>
