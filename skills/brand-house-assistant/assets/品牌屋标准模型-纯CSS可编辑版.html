<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>品牌屋标准模型｜纯CSS可编辑版</title>
  <style>
    :root{--red:#e60012;--orange:#ff6a00;--gold:#f6c400;--brown:#6c321d;--gray:#888;--black:#151515}
    *{box-sizing:border-box}body{margin:0;background:#f3f0ed;color:var(--black);font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif}
    .top{height:58px;background:#fff;border-bottom:1px solid #ddd;padding:0 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
    .top h1{font-size:18px;margin:0}.tools{display:flex;align-items:center;gap:8px;font-size:12px;color:#777}.btn{border:1px solid #d4d4d4;border-radius:7px;padding:8px 12px;background:#fff;cursor:pointer;font-size:13px}.btn.primary{color:#fff;background:#171717;border-color:#171717}
    .stage{padding:24px;display:flex;justify-content:center;overflow:auto}.house{width:min(1500px,calc(100vw - 48px));min-width:1180px;height:1184px;background:#fff;position:relative;box-shadow:0 10px 35px rgba(0,0,0,.13);overflow:hidden}
    .brand-en{position:absolute;left:1.5%;top:12px;font-size:40px;font-weight:700}.brand-cn{position:absolute;left:45%;top:12px;font-size:40px;font-weight:650}.model-mark{position:absolute;right:1.5%;top:18px;font-size:20px;font-weight:700;color:#777}
    .side{position:absolute;right:.5%;top:90px;height:1030px;width:8%;color:var(--brown);display:flex;flex-direction:column;justify-content:space-between;align-items:center;font-size:27px;writing-mode:vertical-rl;letter-spacing:.15em}.side.left{left:3%;right:auto;width:7%;top:795px;height:300px;font-size:25px}
    .roof,.bar,.row,.claim-value,.slogan-value{position:absolute;left:14%;width:72%}.roof{top:70px;height:130px;background:var(--red);clip-path:polygon(50% 0,100% 55%,100% 100%,0 100%,0 55%);display:flex;justify-content:center;align-items:flex-start;padding-top:42px;color:#fff;font-size:24px;font-weight:750}.roof .txt{width:72%;text-align:center;line-height:1.35}
    .bar{height:42px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:750}.mvv-bar{top:200px}.mission{top:242px;height:82px;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--red);border-top:0}.mission>div{display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 24px;font-size:17px;font-weight:700;white-space:pre-wrap;overflow:auto}.mission>div+div{border-left:1px solid var(--red)}
    .position{top:324px;height:44px}.position .editable{width:70%;margin-left:18px;text-align:center}.strategy{top:368px;height:108px;display:grid;grid-template-columns:repeat(3,1fr)}.strategy .head{color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:750}.strategy .cell{display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 18px;font-size:15px;line-height:1.4;border:1px solid #e5e5e5;border-top:0;white-space:pre-wrap;overflow:auto}.strategy>div:nth-child(1){background:var(--orange)}.strategy>div:nth-child(2){background:#ef8732}.strategy>div:nth-child(3){background:var(--gold)}
    .rtb-bar{top:476px;height:39px}.rtb{top:515px;height:340px;display:grid;grid-template-columns:repeat(3,1fr)}.rtb .col{display:flex;flex-direction:column;min-width:0;overflow:hidden;border:1px solid #ddd;border-top:0;padding:14px 16px 12px;font-size:15px;line-height:1.5}.rtb .title{text-align:center;font-weight:750;font-size:19px;margin-bottom:8px}.rtb .editable{flex:1;min-height:0;overflow:auto;white-space:pre-wrap;padding-right:4px}
    .personality-bar{top:855px;height:44px}.personality{top:899px;height:122px;display:grid;grid-template-columns:1fr 1fr;border:1px solid #ddd}.personality>div{display:flex;min-width:0;overflow:hidden;align-items:flex-start;gap:14px;padding:10px 18px;font-size:14px;line-height:1.5}.personality>div+div{border-left:1px solid #ddd}.label{flex:none;color:var(--gray);font-weight:500}.personality .editable{display:block;flex:1;height:100%;overflow:auto;white-space:pre-wrap;font-weight:600}
    .claim-bar{top:1021px;height:38px}.claim-value{top:1059px;height:38px;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px 18px;font-size:16px}.slogan-bar{top:1097px;height:38px}.slogan-value{top:1135px;height:42px;display:flex;align-items:center;justify-content:center;text-align:center;padding:5px 18px;font-size:16px}
    .editable{min-width:0;cursor:text;overflow-wrap:anywhere;word-break:break-word}.editable:empty:before{content:attr(data-placeholder);color:#aaa;font-weight:400}.editable.changed{outline:2px dashed rgba(0,0,0,.3);outline-offset:-2px;background:rgba(255,255,255,.93)}.editable[contenteditable=true]:focus{outline:2px dashed rgba(0,0,0,.35);outline-offset:-2px}
    .drawer{position:fixed;z-index:30;right:0;top:58px;bottom:0;width:min(430px,92vw);background:#fff;box-shadow:-12px 0 35px rgba(0,0,0,.18);transform:translateX(105%);transition:.2s;display:flex;flex-direction:column}.drawer.open{transform:translateX(0)}.drawer h2{font-size:16px;margin:0}.dh{padding:16px 18px;border-bottom:1px solid #eee;display:flex;justify-content:space-between}.tabs{display:flex}.tabs button{flex:1;border:0;background:#fafafa;padding:11px;cursor:pointer}.tabs .active{background:#fff;border-bottom:2px solid #111;font-weight:700}.panel{padding:16px;overflow:auto;flex:1}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:#666;margin-bottom:5px}.field input,.field textarea{width:100%;font:inherit;font-size:13px;border:1px solid #d4d4d4;border-radius:6px;padding:8px}.field textarea{min-height:68px;resize:vertical}.save{display:flex;gap:7px;padding:12px 16px;border-top:1px solid #eee}.save input{flex:1;border:1px solid #d4d4d4;border-radius:6px;padding:8px}.hist{border:1px solid #e5e5e5;border-radius:7px;padding:10px;margin-bottom:9px;font-size:12px}.hist small{display:block;color:#888;margin:4px 0 7px}
    .floating-tools{position:fixed;z-index:50;display:none;align-items:center;gap:6px;padding:8px;background:#171717;color:#fff;border-radius:8px;box-shadow:0 8px 22px rgba(0,0,0,.22);font-size:12px}.floating-tools.show{display:flex}.floating-tools input,.floating-tools select{height:28px;border:0;border-radius:4px;padding:0 5px;font-size:12px}.floating-tools input[type=color]{width:32px;padding:2px}.floating-tools button{border:0;background:#fff;color:#111;border-radius:4px;height:28px;padding:0 8px;cursor:pointer}
    .selection-frame{position:fixed;z-index:45;display:none;border:1.5px solid #1677ff;pointer-events:none}.selection-frame.show{display:block}.move-grip{position:absolute;left:50%;top:-18px;transform:translateX(-50%);background:#1677ff;color:#fff;border-radius:4px;padding:2px 7px;font-size:11px;pointer-events:auto;cursor:move;white-space:nowrap}.handle{position:absolute;width:10px;height:10px;border:2px solid #1677ff;background:#fff;border-radius:2px;pointer-events:auto}.nw{left:-6px;top:-6px;cursor:nwse-resize}.ne{right:-6px;top:-6px;cursor:nesw-resize}.sw{left:-6px;bottom:-6px;cursor:nesw-resize}.se{right:-6px;bottom:-6px;cursor:nwse-resize}.toast{position:fixed;z-index:60;left:50%;bottom:22px;transform:translate(-50%,20px);padding:10px 14px;background:#171717;color:#fff;border-radius:7px;font-size:13px;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:1228px){.stage{justify-content:flex-start}}@page{size:1500px 1184px;margin:0}@media print{html,body{width:1500px;height:1184px;margin:0!important;background:#fff!important;overflow:hidden!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.top,.drawer,.floating-tools,.selection-frame,.toast{display:none!important}.stage{width:1500px;height:1184px;margin:0!important;padding:0!important;display:block!important;overflow:hidden!important}.house{width:1500px!important;min-width:1500px!important;height:1184px!important;box-shadow:none!important}.editable.changed{outline:0!important;background:transparent!important}}
  </style>
</head>
<body>
  <header class="top"><h1>品牌屋标准模型 · 共创工作空间</h1><div class="tools"><span id="meta">当前 v1</span><button class="btn" id="open">编辑 / 版本</button><button class="btn" id="out">导出</button><button class="btn" id="in">导入</button><input id="file" type="file" accept="application/json" hidden></div></header>
  <main class="stage"><section class="house" id="house">
    <div class="brand-en">Brand House</div><div class="brand-cn">品牌屋</div><div class="model-mark">STANDARD MODEL</div>
    <div class="side">顶层设计　　品牌战略　　品牌人格化</div><div class="side left">内蕴　　外显</div>
    <div class="roof"><div class="txt"><div>品牌愿景</div><div class="editable" data-key="vision" data-placeholder="点击填写"></div></div></div>
    <div class="bar mvv-bar">品牌使命　　　　　　　　　品牌价值观</div>
    <div class="row mission"><div class="editable" data-key="mission" data-placeholder="点击填写品牌使命"></div><div class="editable" data-key="values" data-placeholder="点击填写品牌价值观"></div></div>
    <div class="bar position"><span>品牌定位</span><span class="editable" data-key="position" data-placeholder="点击填写"></span></div>
    <div class="row strategy"><div class="head">品类定位（自我视角）</div><div class="head">核心客群与场景（用户视角）</div><div class="head">差异化价值（竞争视角）</div><div class="cell editable" data-key="category" data-placeholder="点击填写"></div><div class="cell editable" data-key="audience" data-placeholder="点击填写"></div><div class="cell editable" data-key="benefit" data-placeholder="点击填写“更XX”"></div></div>
    <div class="bar rtb-bar">品牌RTB</div><div class="row rtb"><div class="col"><div class="title">产品证据</div><div class="editable" data-key="rtbProduct" data-placeholder="点击填写"></div></div><div class="col"><div class="title">体验证据</div><div class="editable" data-key="rtbExperience" data-placeholder="点击填写"></div></div><div class="col"><div class="title">背书证据</div><div class="editable" data-key="rtbBacking" data-placeholder="点击填写"></div></div></div>
    <div class="bar personality-bar">品牌个性</div><div class="row personality"><div><span class="label">性格特质</span><span class="editable" data-key="personality" data-placeholder="点击填写"></span></div><div><span class="label">沟通语言</span><span class="editable" data-key="tone" data-placeholder="点击填写"></span></div></div>
    <div class="bar claim-bar">品牌主张</div><div class="editable claim-value" data-key="claim" data-placeholder="点击填写品牌主张"></div>
    <div class="bar slogan-bar">品牌口号</div><div class="editable slogan-value" data-key="slogan" data-placeholder="可留空，确认后填写"></div>
  </section></main>
  <aside class="drawer" id="drawer"><div class="dh"><h2>编辑与版本历史</h2><button class="btn" id="close">关闭</button></div><div class="tabs"><button class="active" data-tab="edit">内容编辑</button><button data-tab="history">版本历史</button></div><section class="panel" id="editPanel"></section><section class="panel" id="historyPanel" hidden></section><div class="save"><input id="note" placeholder="填写本次修改说明（必填）"><button class="btn primary" id="save">保存版本</button></div></aside>
  <div class="floating-tools" id="floatingTools"><span id="selectedName">文字</span><label>字号 <input id="fontSize" type="number" min="8" max="72" step="1" style="width:54px"></label><label>粗细 <select id="fontWeight"><option value="400">常规</option><option value="500">中等</option><option value="600">半粗</option><option value="700">粗体</option><option value="800">特粗</option></select></label><label>颜色 <input id="fontColor" type="color"></label><label>对齐 <select id="textAlign"><option value="left">左</option><option value="center">中</option><option value="right">右</option></select></label><label>行高 <input id="lineHeight" type="number" min="0.8" max="3" step="0.1" style="width:52px"></label><button id="resetStyle">重置样式</button></div>
  <div class="selection-frame" id="selectionFrame"><div class="move-grip">移动</div><i class="handle nw"></i><i class="handle ne"></i><i class="handle sw"></i><i class="handle se"></i></div><div class="toast" id="toast"></div>
	  <script>
	    const KEY='brand-house-standard-model-v1';
	    const fields=[['vision','品牌愿景','textarea'],['mission','品牌使命','textarea'],['values','品牌价值观','textarea'],['position','品牌定位','input'],['category','品类定位','input'],['audience','核心客群与场景','textarea'],['benefit','差异化价值','input'],['rtbProduct','产品证据','textarea'],['rtbExperience','体验证据','textarea'],['rtbBacking','背书证据','textarea'],['personality','性格特质','textarea'],['tone','沟通语言','textarea'],['claim','品牌主张','input'],['slogan','品牌口号','input']];
	    const ui={
	      house:document.getElementById('house'),drawer:document.getElementById('drawer'),open:document.getElementById('open'),close:document.getElementById('close'),
	      editPanel:document.getElementById('editPanel'),historyPanel:document.getElementById('historyPanel'),note:document.getElementById('note'),save:document.getElementById('save'),
	      out:document.getElementById('out'),in:document.getElementById('in'),file:document.getElementById('file'),floatingTools:document.getElementById('floatingTools'),
	      selectedName:document.getElementById('selectedName'),fontSize:document.getElementById('fontSize'),fontWeight:document.getElementById('fontWeight'),
	      fontColor:document.getElementById('fontColor'),textAlign:document.getElementById('textAlign'),lineHeight:document.getElementById('lineHeight'),
	      resetStyle:document.getElementById('resetStyle'),selectionFrame:document.getElementById('selectionFrame')
	    };
	    const defaults=Object.fromEntries(fields.map(x=>[x[0],'']));let state=load(),draft=clone(state.current),selected=null,drag=null;
    function clone(v){return JSON.parse(JSON.stringify(v))}function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.current&&Array.isArray(x.history))return x}catch(e){}return{current:{...defaults,styles:{},layout:{}},history:[{version:1,time:new Date().toISOString(),note:'空白标准模板',data:{...defaults,styles:{},layout:{}}}]}}function persist(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
    function applyVisual(el,key){const s=(draft.styles||{})[key]||{},l=(draft.layout||{})[key];['fontSize','fontWeight','color','textAlign','lineHeight'].forEach(p=>{el.style[p]=s[p]?(p==='fontSize'?s[p]+'px':s[p]):''});el.style.transform=l?`translate(${l.tx}%,${l.ty}%) scale(${l.sx},${l.sy})`:'';el.style.transformOrigin='center center'}
    function renderCanvas(){document.querySelectorAll('[data-key]').forEach(el=>{const key=el.dataset.key;if(document.activeElement!==el)el.textContent=draft[key]||'';el.classList.toggle('changed',Boolean(draft[key]));applyVisual(el,key)});document.getElementById('meta').textContent='当前 v'+state.history.at(-1).version}
	    function renderForm(){ui.editPanel.innerHTML=fields.map(([key,label,type])=>`<div class="field"><label>${label}</label>${type==='textarea'?`<textarea data-input="${key}">${esc(draft[key])}</textarea>`:`<input data-input="${key}" value="${esc(draft[key])}">`}</div>`).join('');ui.editPanel.querySelectorAll('[data-input]').forEach(input=>input.oninput=e=>{draft[e.target.dataset.input]=e.target.value;renderCanvas()})}
	    function renderHistory(){ui.historyPanel.innerHTML=state.history.slice().reverse().map(item=>`<div class="hist"><strong>v${item.version}</strong><small>${new Date(item.time).toLocaleString('zh-CN')} · ${esc(item.note)}</small><button class="btn" data-preview="${item.version}">预览</button> <button class="btn" data-restore="${item.version}">恢复</button></div>`).join('');ui.historyPanel.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>{draft=clone(state.history.find(x=>x.version==b.dataset.preview).data);render();toast('已预览历史版本')});ui.historyPanel.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{const item=state.history.find(x=>x.version==b.dataset.restore);draft=clone(item.data);saveVersion('从 v'+item.version+' 恢复')})}
    function render(){renderCanvas();renderForm();renderHistory()}function saveVersion(note){const version=state.history.at(-1).version+1;state.current=clone(draft);state.history.push({version,time:new Date().toISOString(),note,data:clone(draft)});persist();render();toast('已保存为 v'+version)}
    document.querySelectorAll('[data-key]').forEach(el=>{el.contentEditable='true';el.spellcheck=false;el.oninput=()=>{draft[el.dataset.key]=el.innerText;el.classList.toggle('changed',Boolean(draft[el.dataset.key]))};el.onclick=e=>{e.stopPropagation();selectElement(el)}});
	    function selectElement(el){selected=el;const r=el.getBoundingClientRect(),box=ui.floatingTools;box.classList.add('show');const width=box.offsetWidth||420,height=box.offsetHeight||44,above=r.top-height-28;box.style.left=Math.max(8,Math.min(innerWidth-width-8,r.left))+'px';box.style.top=(above>=66?above:Math.min(innerHeight-height-8,r.bottom+24))+'px';ui.selectedName.textContent=fields.find(x=>x[0]===el.dataset.key)?.[1]||el.dataset.key;syncStyle();syncFrame()}
	    function syncStyle(){if(!selected)return;const s=(draft.styles||{})[selected.dataset.key]||{},cs=getComputedStyle(selected);ui.fontSize.value=s.fontSize||parseFloat(cs.fontSize);ui.fontWeight.value=s.fontWeight||cs.fontWeight;ui.fontColor.value=s.color||rgbToHex(cs.color);ui.textAlign.value=s.textAlign||cs.textAlign;ui.lineHeight.value=s.lineHeight||parseFloat(cs.lineHeight)/parseFloat(cs.fontSize)||1.3}function rgbToHex(rgb){const m=rgb.match(/\d+/g);return m?'#'+m.slice(0,3).map(x=>Number(x).toString(16).padStart(2,'0')).join(''):'#151515'}function setStyle(prop,value){if(!selected)return;draft.styles=draft.styles||{};draft.styles[selected.dataset.key]=draft.styles[selected.dataset.key]||{};draft.styles[selected.dataset.key][prop]=value;applyVisual(selected,selected.dataset.key);syncFrame()}
	    ui.fontSize.oninput=e=>setStyle('fontSize',e.target.value);ui.fontWeight.onchange=e=>setStyle('fontWeight',e.target.value);ui.fontColor.oninput=e=>setStyle('color',e.target.value);ui.textAlign.onchange=e=>setStyle('textAlign',e.target.value);ui.lineHeight.oninput=e=>setStyle('lineHeight',e.target.value);ui.resetStyle.onclick=()=>{if(!selected)return;draft.styles[selected.dataset.key]={};applyVisual(selected,selected.dataset.key);syncStyle()};
	    function syncFrame(){if(!selected){ui.selectionFrame.classList.remove('show');return}const r=selected.getBoundingClientRect();ui.selectionFrame.classList.add('show');Object.assign(ui.selectionFrame.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'})}function pointerStart(e,type){if(!selected)return;e.preventDefault();const hr=ui.house.getBoundingClientRect(),er=selected.getBoundingClientRect(),old=(draft.layout||{})[selected.dataset.key]||{tx:0,ty:0,sx:1,sy:1};drag={type,startX:e.clientX,startY:e.clientY,width:er.width,height:er.height,hr,old};addEventListener('pointermove',pointerMove);addEventListener('pointerup',pointerEnd,{once:true})}function pointerMove(e){if(!drag)return;const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;let{tx,ty,sx,sy}=drag.old;if(drag.type==='move'){tx+=dx/drag.width*100;ty+=dy/drag.height*100}else{if(drag.type.includes('e'))sx=Math.max(.25,drag.old.sx+dx/drag.width);if(drag.type.includes('w'))sx=Math.max(.25,drag.old.sx-dx/drag.width);if(drag.type.includes('s'))sy=Math.max(.25,drag.old.sy+dy/drag.height);if(drag.type.includes('n'))sy=Math.max(.25,drag.old.sy-dy/drag.height)}draft.layout=draft.layout||{};draft.layout[selected.dataset.key]={tx,ty,sx,sy};applyVisual(selected,selected.dataset.key);syncFrame()}function pointerEnd(){removeEventListener('pointermove',pointerMove);drag=null}
	    document.querySelector('.move-grip').onpointerdown=e=>pointerStart(e,'move');document.querySelectorAll('.handle').forEach(h=>h.onpointerdown=e=>pointerStart(e,[...h.classList].find(x=>['nw','ne','sw','se'].includes(x))));addEventListener('resize',syncFrame);ui.house.onclick=e=>{if(e.target===ui.house){selected=null;ui.selectionFrame.classList.remove('show');ui.floatingTools.classList.remove('show')}};
	    ui.open.onclick=()=>ui.drawer.classList.add('open');ui.close.onclick=()=>ui.drawer.classList.remove('open');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));const editing=b.dataset.tab==='edit';ui.editPanel.hidden=!editing;ui.historyPanel.hidden=editing;document.querySelector('.save').hidden=!editing});ui.save.onclick=()=>{const n=ui.note.value.trim();if(!n)return toast('请填写修改说明');ui.note.value='';saveVersion(n)};
	    ui.out.onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({...state,template:'brand-house-standard-model',exportedAt:new Date().toISOString()},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='品牌屋版本包.json';a.click();URL.revokeObjectURL(url);toast('版本包已导出')};ui.in.onclick=()=>ui.file.click();ui.file.onchange=e=>{const chosen=e.target.files[0];if(!chosen)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!x.current||!Array.isArray(x.history))throw Error();state=x;draft=clone(x.current);persist();render();toast('导入成功')}catch(_){toast('导入失败：格式不正确')}};reader.readAsText(chosen)};render();persist();
  </script>
</body>
</html>
